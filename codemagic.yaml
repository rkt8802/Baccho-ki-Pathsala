workflows:
  android-apk-build:
    name: Build Baccho ki Pathsala Android APK
    instance_type: mac_mini_m1
    environment:
      java: 17
      vars:
        ANDROID_HOME: /Users/builder/programs/android-sdk
    scripts:
      - name: Set up Gradle Wrapper and Local Properties
        script: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build Android APK
        script: |
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/**/*.apk
