<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Baccho-ki-Pathsala 🎒 | By Ranjeet Thakur</title>
  
  <style>
    /* ==========================================================================
       CSS VARIABLES & THEME
       ========================================================================== */
    :root {
      --primary: #FF5A5F;
      --secondary: #00B4D8;
      --accent: #FFD166;
      --green: #06D6A0;
      --purple: #8338EC;
      --bg-color: #F4F9FD;
      --text-dark: #1E293B;
      --card-bg: #FFFFFF;
      --font-family: 'Fredoka One', 'Chalkboard SE', 'Comic Sans MS', 'Bubblegum Sans', cursive, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: var(--font-family);
      color: var(--text-dark);
    }

    /* ==========================================================================
       FULLSCREEN OVERLAY GATE
       ========================================================================== */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #FF5A5F 0%, #8338EC 50%, #00B4D8 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      text-align: center;
      padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .overlay-mascot {
      font-size: 5rem;
      margin-bottom: 8px;
      animation: float 2.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .overlay-title {
      color: #FFFFFF;
      font-size: 2.5rem;
      letter-spacing: 1px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin-bottom: 4px;
    }

    .overlay-subtitle {
      color: var(--accent);
      font-size: 1.2rem;
      margin-bottom: 24px;
      font-weight: bold;
    }

    .start-btn {
      background-color: var(--accent);
      color: #B91C1C;
      font-family: var(--font-family);
      font-size: 1.5rem;
      font-weight: 900;
      padding: 16px 42px;
      border-radius: 50px;
      border: 4px solid #FFFFFF;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: bounce 1.8s infinite ease-in-out;
      outline: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .dev-badge-overlay {
      margin-top: 24px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 8px 20px;
      border-radius: 30px;
      color: #FFFFFF;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* ==========================================================================
       MAIN APP SHELL
       ========================================================================== */
    #app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    header {
      height: 60px;
      background: linear-gradient(90deg, var(--primary), #FF758C);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      z-index: 20;
      flex-shrink: 0;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #FFFFFF;
      font-size: 1.4rem;
      font-weight: 900;
    }

    .dev-tag {
      background: linear-gradient(135deg, var(--accent), #FFAA00);
      color: #78350F;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 900;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .app-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* Sidebar Navigation */
    aside.sidebar {
      width: 250px;
      background-color: #FFFFFF;
      border-right: 3px solid #E2E8F0;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .nav-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94A3B8;
      padding: 2px 10px;
      font-weight: bold;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #F8FAFC;
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 10px 14px;
      font-family: var(--font-family);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .nav-btn .nav-emoji {
      font-size: 1.3rem;
    }

    .nav-btn:hover {
      background-color: #F0FDFA;
      border-color: var(--secondary);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, var(--secondary), #0096C7);
      color: #FFFFFF;
      border-color: #023E8A;
      box-shadow: 0 4px 10px rgba(0, 180, 216, 0.35);
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 2px dashed #E2E8F0;
      text-align: center;
      font-size: 0.78rem;
      color: #64748B;
    }

    /* Main Scroll Area */
    main.content-area {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 14px 20px 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    /* ==========================================================================
       LARGE HERO VIDEO & ANIMATED THEATRE AREA
       ========================================================================== */
    .theatre-wrapper {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      background: #0B132B;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      border: 5px solid var(--accent);
      flex-shrink: 0;
    }

    .theatre-screen {
      position: relative;
      width: 100%;
      height: 48vh; /* Large Expanded Video Area */
      min-height: 280px;
      max-height: 480px;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Stage Background Animation Effects */
    .stage-backdrop {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #1C2541 0%, #0B132B 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }

    .animated-hero-icon {
      font-size: 5.5rem;
      margin-bottom: 8px;
      animation: hero-wiggle 2s infinite ease-in-out;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.4));
    }

    @keyframes hero-wiggle {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-14px) scale(1.1); }
    }

    .story-bubble {
      background: rgba(255, 255, 255, 0.95);
      color: #0F172A;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 1.15rem;
      font-weight: 800;
      max-width: 85%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      border: 3px solid var(--secondary);
      line-height: 1.35;
    }

    .stage-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 80px 70px, #fff, rgba(0,0,0,0)),
                        radial-gradient(3px 3px at 200px 150px, var(--accent), rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 300px 80px, #fff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 350px 350px;
      opacity: 0.6;
    }

    /* HTML5 Direct Video Player Mode */
    video#direct-video-player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    /* Theatre Bar */
    .theatre-controls-bar {
      background-color: #FFFFFF;
      padding: 10px 16px;
      border-top: 3px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .now-playing-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex: 1;
    }

    .now-playing-badge {
      background-color: var(--primary);
      color: white;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .now-playing-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theatre-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: var(--font-family);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-play-sound {
      background: var(--green);
      color: #064E3B;
    }

    .btn-switch-video {
      background: var(--purple);
      color: #FFFFFF;
    }

    /* ==========================================================================
       COMPACT & SMALL VIDEO CARDS GRID
       ========================================================================== */
    .grid-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px dashed #CBD5E1;
      padding-bottom: 6px;
    }

    .grid-title {
      font-size: 1.3rem;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-tag {
      background: #E0F2FE;
      color: #0369A1;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 2px 10px;
      border-radius: 12px;
    }

    /* Small, Space-saving Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .video-card {
      background-color: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
      border: 2px solid #E2E8F0;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 8px 10px;
      gap: 10px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .video-card:hover {
      transform: translateY(-3px);
      border-color: var(--secondary);
      box-shadow: 0 6px 14px rgba(0, 180, 216, 0.25);
    }

    .video-card.active-playing {
      border-color: var(--primary);
      background-color: #FFF5F5;
      box-shadow: 0 0 0 2px var(--accent);
    }

    /* Small Icon Badge */
    .card-small-icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      background: linear-gradient(135deg, #FFEAA7, #FFD3B6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      position: relative;
    }

    .card-lang-dot {
      position: absolute;
      top: -4px;
      left: -4px;
      background: #0F172A;
      color: #FFF;
      font-size: 0.6rem;
      font-weight: 900;
      padding: 1px 4px;
      border-radius: 6px;
    }

    .card-info {
      flex: 1;
      overflow: hidden;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .card-action-text {
      font-size: 0.72rem;
      color: var(--secondary);
      font-weight: bold;
    }

    /* ==========================================================================
       MOBILE RESPONSIVENESS
       ========================================================================== */
    @media (max-width: 768px) {
      header {
        height: 52px;
        padding: 0 12px;
      }
      .app-brand { font-size: 1.15rem; }
      .dev-tag { font-size: 0.75rem; padding: 4px 8px; }
      
      .app-body {
        flex-direction: column;
        height: calc(100vh - 52px);
      }

      aside.sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 2px solid #E2E8F0;
        padding: 6px 10px;
        flex-direction: row;
        gap: 6px;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
      }

      .nav-label, .sidebar-footer { display: none; }
      .nav-btn { padding: 6px 12px; font-size: 0.85rem; border-radius: 20px; }
      .nav-btn .nav-emoji { font-size: 1.1rem; }

      main.content-area { padding: 10px 10px 30px 10px; gap: 10px; }
      .theatre-wrapper { border-width: 3px; border-radius: 14px; }
      .theatre-screen { height: 36vh; min-height: 200px; }
      .animated-hero-icon { font-size: 3.8rem; }
      .story-bubble { font-size: 0.92rem; padding: 6px 12px; }

      .video-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .card-small-icon { width: 38px; height: 38px; min-width: 38px; font-size: 1.3rem; }
      .card-title { font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <!-- TAP TO START OVERLAY -->

  <!-- APP SHELL -->
  <div id="app-container">
    
    <!-- Header -->
    <header>

    <div class="app-body">

            { id: "rh6", title: "Johny Johny Yes Papa", emoji: "👶", lang: "EN", text: "Johny Johny? Yes Papa! Eating sugar? No Papa! Telling lies? No Papa! Open your mouth, Ha! Ha! Ha!", vIdx: 0 },

      // State
      let currentCategoryKey = 'rhymes';
      let currentPlayingItem = null;
      let isVideoMode = false;

      // DOM Elements
      const startOverlay = document.getElementById('start-overlay');
      const startBtn = document.getElementById('start-app-btn');
      const sidebarNav = document.getElementById('sidebar-nav');
      const videoCardsGrid = document.getElementById('video-cards-grid');
      const activeCategoryTitle = document.getElementById('active-category-title');
      const lessonCountTag = document.getElementById('lesson-count-tag');
      const stageBackdrop = document.getElementById('stage-backdrop');
      const stageIcon = document.getElementById('stage-icon');
      const stageText = document.getElementById('stage-text');
      const directVideoPlayer = document.getElementById('direct-video-player');
      const directVideoSource = document.getElementById('direct-video-source');
      const nowPlayingText = document.getElementById('now-playing-text');
      const btnReplayVoice = document.getElementById('btn-replay-voice');
      const btnToggleVideo = document.getElementById('btn-toggle-video');
      const contentScrollArea = document.getElementById('content-scroll-area');

      // Fullscreen Trigger
      function requestFullscreenMode() {
        const doc = document.documentElement;
        if (doc.requestFullscreen) doc.requestFullscreen().catch(() => {});
        else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
      }

      startBtn.addEventListener('click', () => {
        requestFullscreenMode();
        startOverlay.classList.add('hidden');
        playLesson(videoData[currentCategoryKey].videos[0]);
      });

      // Cheerful Voice Narrator
      function playVoiceNarration(text, lang = 'HI') {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = lang === 'HI' ? 'hi-IN' : 'en-US';
          utter.rate = 0.9;
          utter.pitch = 1.15;
          window.speechSynthesis.speak(utter);
        }
      }

      btnReplayVoice.addEventListener('click', () => {
        if (currentPlayingItem) {
          playVoiceNarration(currentPlayingItem.text, currentPlayingItem.lang);
        }
      });

      btnToggleVideo.addEventListener('click', () => {
        isVideoMode = !isVideoMode;
        updateStageDisplay();
      });

      function updateStageDisplay() {
        if (isVideoMode) {
          stageBackdrop.style.display = 'none';
          directVideoPlayer.style.display = 'block';
          btnToggleVideo.innerHTML = '<span>🎨 Cartoon Mode</span>';
          directVideoPlayer.play().catch(() => {});
        } else {
          directVideoPlayer.pause();
          directVideoPlayer.style.display = 'none';
          stageBackdrop.style.display = 'flex';
          btnToggleVideo.innerHTML = '<span>🎬 Video Mode</span>';
          if (currentPlayingItem) {
            playVoiceNarration(currentPlayingItem.text, currentPlayingItem.lang);
          }
        }
      }

      // Play Lesson Function (100% Guaranteed Native Execution)
      function playLesson(item) {
        if (!item) return;
        currentPlayingItem = item;

        // Update Labels & Stage
        nowPlayingText.textContent = `${item.emoji} [${item.lang}] ${item.title}`;
        stageIcon.textContent = item.emoji;
        stageText.textContent = item.text;

        // Set direct MP4 source
        const streamUrl = directVideoPool[item.vIdx % directVideoPool.length];
        directVideoSource.src = streamUrl;
        directVideoPlayer.load();

        updateStageDisplay();

        // Highlight selected compact card
        document.querySelectorAll('.video-card').forEach((card) => {
          if (card.dataset.id === item.id) {
            card.classList.add('active-playing');
          } else {
            card.classList.remove('active-playing');
          }
        });
      }

      // Render Navigation
      function renderNav() {
        const footer = sidebarNav.querySelector('.sidebar-footer');
        sidebarNav.innerHTML = '<span class="nav-label">Categories</span>';

        Object.keys(videoData).forEach((key) => {
          const cat = videoData[key];
          const btn = document.createElement('button');
          btn.className = `nav-btn ${key === currentCategoryKey ? 'active' : ''}`;
          btn.innerHTML = `<span class="nav-emoji">${cat.emoji}</span><span>${cat.name}</span>`;

          btn.addEventListener('click', () => {
            if (currentCategoryKey !== key) {
              currentCategoryKey = key;
              updateNavSelection();
              renderCardsGrid();
            }
          });

          sidebarNav.appendChild(btn);
        });

        if (footer) sidebarNav.appendChild(footer);
      }

      function updateNavSelection() {
        const buttons = sidebarNav.querySelectorAll('.nav-btn');
        const keys = Object.keys(videoData);
        buttons.forEach((btn, i) => {
          if (keys[i] === currentCategoryKey) btn.classList.add('active');
          else btn.classList.remove('active');
        });
      }

      // Render Small Title Icons Grid
      function renderCardsGrid() {
        const cat = videoData[currentCategoryKey];
        activeCategoryTitle.innerHTML = `${cat.emoji} ${cat.name}`;
        lessonCountTag.textContent = `${cat.videos.length} Lessons`;
        videoCardsGrid.innerHTML = '';

        cat.videos.forEach((video) => {
          const card = document.createElement('div');
          card.className = `video-card ${currentPlayingItem && currentPlayingItem.id === video.id ? 'active-playing' : ''}`;
          card.dataset.id = video.id;
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', '0');

          // Small compact title & icon layout
          card.innerHTML = `
            <div class="card-small-icon">
              <span class="card-lang-dot">${video.lang}</span>
              <span>${video.emoji}</span>
            </div>
            <div class="card-info">
              <div class="card-title">${video.title}</div>
              <div class="card-action-text">▶ Play Now</div>
            </div>
          `;

          const triggerPlay = () => {
            playLesson(video);
            contentScrollArea.scrollTo({ top: 0, behavior: 'smooth' });
          };

          card.addEventListener('click', triggerPlay);
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              triggerPlay();
            }
          });

          videoCardsGrid.appendChild(card);
        });
      }

      // Initialize
      renderNav();
      renderCardsGrid();
    })();
  </script>
